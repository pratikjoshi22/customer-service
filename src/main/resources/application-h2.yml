# ── H2 Profile ─────────────────────────────────────────
# Activate with: mvn spring-boot:run -Dspring-boot.run.profiles=h2
# Overrides only the database config; everything else comes from application.yml

spring:
  datasource:
    url: jdbc:h2:mem:customerdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect
